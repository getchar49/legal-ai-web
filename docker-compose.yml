version: "3.9"
services:
  web:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: legal-ai-web-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_BASE_URL=http://host.docker.internal:8000
    restart: unless-stopped
